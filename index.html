<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F6ECD3" />
    <meta name="description" content="Periodische Sporttests, Leistungsdiagnostik und Benchmarking für Athleten und Trainer." />

    <title>Baseline — Sportdiagnostik</title>

    <script>
      // Theme vor dem ersten Paint setzen, damit es nicht kurz aufblitzt.
      (function () {
        try {
          var stored = localStorage.getItem('baseline.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {
          /* Private Mode o. ä. — dann gilt die Systemeinstellung. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
