<!doctype html><meta charset="utf-8"><title>Mockup Bogen-Navigation</title><style>
:root{--surface:#fff;--sunken:#D6E3E2;--line:#C3D2CF;--ink:#0d1f1b;--ink2:#40544f;--accent:#1E7D63;--ink-on:#F4FBF8;--quiet:rgba(30,125,99,.14);--bg:#EEF4F3;--glow:#3FBF93}
.dark{--surface:#1B252B;--sunken:#070A0D;--line:#2F3A3F;--ink:#E7F1EE;--ink2:#9DB2AD;--accent:#7FE5B5;--ink-on:#06100B;--quiet:rgba(127,229,181,.18);--bg:#0c1216;--glow:#A6F0CE}
body{margin:0;padding:28px;background:#9aa;font-family:system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
figure{margin:0;width:390px;color:#111}figcaption{margin-top:10px;font-size:13px;line-height:1.4;text-align:center;color:#111}
.phone{width:390px;height:720px;border-radius:38px;background:#000;padding:8px;box-sizing:border-box}
.screen{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:var(--bg);color:var(--ink)}
.hd{padding:34px 20px 10px;display:flex;justify-content:space-between;align-items:baseline;font-size:26px}.hd span{font-size:13px;color:var(--ink2)}
.card{margin:0 16px 12px;height:96px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}.card.s{height:64px}
.dock{position:absolute;left:0;right:0;bottom:0;width:390px}
.arc{position:absolute;left:0;bottom:0;overflow:visible;filter:drop-shadow(0 -6px 18px rgba(0,0,0,.18))}
.arc path{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.tab{position:absolute;border-radius:50%;display:grid;place-items:center;color:var(--ink2);background:var(--sunken);border:1px solid var(--line);box-sizing:border-box}
.tab.on{background:var(--accent);color:var(--ink-on);border-color:var(--accent);box-shadow:0 0 22px -4px var(--glow)}
.tab.big{border-width:2px}
.tab.flash{background:var(--glow);color:var(--ink-on);box-shadow:0 0 0 6px var(--quiet),0 0 26px 2px var(--glow)}
.lbl{position:absolute;width:60px;text-align:center;font-size:11px;color:var(--ink2);letter-spacing:.02em}.lbl.on{color:var(--accent);font-weight:700}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.0)}
.tag{position:absolute;top:196px;left:16px;right:16px;font-size:12px;color:var(--ink2)}
.m{position:absolute;left:0;width:100%;font-size:11px;color:#c0392b;font-weight:700}
</style>
