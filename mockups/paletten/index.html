<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseline — Farbvorschläge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  :root { color-scheme: light; --page:#E8E8E6; --pageink:#1A1A18; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--pageink);
    font:15px/1.55 "IBM Plex Sans", system-ui, sans-serif; }
  header { padding:56px 32px 24px; max-width:1180px; margin:0 auto; }
  h1 { font:700 30px/1.1 "Saira Condensed", system-ui, sans-serif; letter-spacing:.06em; text-transform:uppercase; margin:0 0 10px; }
  header p { max-width:74ch; margin:0; opacity:.75; }
  section { max-width:1180px; margin:0 auto; padding:40px 32px 56px; border-top:1px solid rgba(0,0,0,.12); }
  h2 { font:700 24px/1.1 "Saira Condensed", system-ui, sans-serif; letter-spacing:.05em; text-transform:uppercase; margin:0 0 6px; }
  .why { max-width:78ch; margin:0 0 22px; opacity:.75; font-size:14px; }
  .swatches { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:26px; }
  .sw { width:132px; border-radius:10px; overflow:hidden; border:1px solid rgba(0,0,0,.12); background:#fff; }
  .sw i { display:block; height:52px; }
  .sw b { display:block; font-size:11px; padding:6px 8px 0; letter-spacing:.04em; text-transform:uppercase; }
  .sw span { display:block; font:11px/1.6 "IBM Plex Mono", monospace; padding:0 8px 7px; opacity:.6; }
  .pair { display:flex; gap:26px; flex-wrap:wrap; }
  .phone { width:340px; border-radius:26px; overflow:hidden; border:1px solid rgba(0,0,0,.18);
    box-shadow:0 18px 44px rgba(0,0,0,.18); }
  .mode { font:11px/1 "IBM Plex Mono", monospace; letter-spacing:.2em; text-transform:uppercase; opacity:.55; margin:0 0 8px; }

  /* --- Der nachgebaute Bildschirm ------------------------------------ */
  .app { background:var(--plane); color:var(--ink); padding-bottom:14px; }
  .bar { display:flex; align-items:center; gap:9px; padding:13px 14px; border-bottom:1px solid var(--line); }
  .tile { width:24px; height:24px; border-radius:5px; background:var(--ink); display:grid; place-items:center; }
  .tile svg { width:17px; height:17px; }
  .brand { font:700 15px/1 "Saira Condensed", system-ui, sans-serif; letter-spacing:.13em; text-transform:uppercase; }
  .brand small { display:block; font-size:8px; letter-spacing:.18em; opacity:.6; margin-top:2px; }
  .body { padding:16px 14px 0; }
  .eyebrow { font:11px/1 "IBM Plex Mono", monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .name { font:700 30px/1 "Saira Condensed", system-ui, sans-serif; margin:9px 0 3px; }
  .sport { font-size:12px; color:var(--secondary); }
  .cta { float:right; margin-top:-46px; background:var(--accent); color:var(--accent-ink);
    border-radius:999px; padding:10px 16px; font:700 11px/1 "Saira Condensed", system-ui, sans-serif;
    letter-spacing:.14em; text-transform:uppercase; }
  .due { margin:16px 0 0; padding:11px 13px; border-radius:12px; background:var(--sunken);
    display:flex; justify-content:space-between; font-size:12.5px; }
  .orbwrap { display:grid; place-items:center; padding:16px 0 6px; }
  .cards { display:flex; gap:9px; align-items:flex-start; }
  .card { flex:1; background:var(--raised); border:1px solid var(--line); border-radius:14px; padding:10px 11px; }
  .card:nth-child(2) { margin-top:16px; }
  .card:nth-child(3) { margin-top:6px; }
  .card b { display:block; font:11px/1 "IBM Plex Mono", monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .card i { display:block; font:700 25px/1 "IBM Plex Mono", monospace; font-style:normal; margin-top:8px; }
  .card u { display:block; text-decoration:none; font-size:10.5px; color:var(--muted); margin-top:6px; }
  .next { margin-top:14px; border-radius:14px; padding:12px 13px; background:var(--accent); color:var(--accent-ink); }
  .next b { display:block; font:11px/1 "IBM Plex Mono", monospace; letter-spacing:.14em; text-transform:uppercase; opacity:.75; }
  .next p { margin:7px 0 0; font:700 15px/1.2 "Saira Condensed", system-ui, sans-serif; letter-spacing:.02em; }
  .rows { margin-top:14px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--surface); }
  .row { display:flex; justify-content:space-between; padding:10px 12px; font-size:12.5px; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row span { font:12.5px/1 "IBM Plex Mono", monospace; }
  .row em { display:block; font-style:normal; font-size:10.5px; color:var(--muted); margin-top:3px; }
  .nav { margin:14px 10px 0; border-radius:999px; background:var(--raised); border:1px solid var(--line);
    display:flex; justify-content:space-around; padding:8px 0; font:9px/1 "IBM Plex Mono", monospace;
    letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .nav b { color:var(--ink); }
  /* Hero der Landing */
  .hero { background:var(--plane); color:var(--ink); padding:26px 16px 22px; border-top:1px solid var(--line); position:relative; overflow:hidden; }
  .hero canvas { position:absolute; inset:0; width:100%; height:100%; }
  .hero > * { position:relative; }
  .hero h3 { margin:8px 0 0; font:700 27px/.92 "Saira Condensed", system-ui, sans-serif; text-transform:uppercase; letter-spacing:-.01em; }
  .hero h3 span { opacity:.45; }
  .btn { display:inline-block; margin-top:14px; border:1px solid var(--strong); border-radius:3px;
    padding:9px 15px; font:11px/1 "IBM Plex Sans", sans-serif; letter-spacing:.12em; text-transform:uppercase; }
</style>
</head>
<body>
<header>
  <h1>Baseline — drei Farbvorschläge</h1>
  <p>Jeder Vorschlag steht in hell und dunkel und ist gegen die vier Flächen der App gerechnet:
     4,5:1 für Fliesstext, 3:1 für Bedienelemente. Der Bildschirm darunter ist die Übersicht,
     nachgebaut mit denselben Abständen und Schriften wie die App — nur die Farben wechseln.</p>
</header>
<div id="out"></div>

<script>
const WAVE = '<svg viewBox="0 0 32 32" fill="none"><path d="M5 21h4l4-11 4 16 4-13 2 8h4" stroke="var(--plane)" stroke-width="2.4" stroke-linecap="square"/></svg>'

const PALETTES = [
  {
    name: 'Kreide & Graphit',
    why: 'Papierweiss mit einem Stich ins Warme, Graphit als tragende Fläche, dazu EIN Signalton: gebranntes Rostrot. '
       + 'Die Herkunft ist das Messgerät und das Laborheft — nichts leuchtet, alles ist ablesbar. Der Signalton kommt nur '
       + 'dort vor, wo etwas ansteht; dadurch fällt er auf, ohne dass die Oberfläche laut wird.',
    tones: [['Kreide','#F1EFE9'],['Graphit','#24262B'],['Tiefschwarz','#1B1B19'],['Rostrot','#B7532A'],['Stein','#A6A29A']],
    light: {plane:'#F1EFE9',surface:'#F7F6F2',raised:'#FCFBF8',sunken:'#E1DED5',ink:'#1B1B19',secondary:'#4C4C46',muted:'#5C5C55',accent:'#24262B','accent-ink':'#F1EFE9',glow:'#B7532A',line:'#CFCCC3',strong:'#A6A29A'},
    dark:  {plane:'#131311',surface:'#1D1E1B',raised:'#262723',sunken:'#0D0D0C',ink:'#F1EFE9',secondary:'#B3B0A8',muted:'#A09D95',accent:'#C4653A','accent-ink':'#131311',glow:'#E39268',line:'#33342F',strong:'#5A5B55'},
  },
  {
    name: 'Alpin',
    why: 'Kühl und klinisch: Schneegrau als Grund, Petrolblau als Marke, Gletscherblau als Lichtspitze. '
       + 'Das ist die Sprache der Diagnostik — Ultraschall, Röntgen, Höhenmesser. Blau hat gegenüber Grün den Vorteil, '
       + 'dass Rot-Grün-Schwäche es nicht antastet, und gegenüber Violett den, dass es kein Modeton ist.',
    tones: [['Schneegrau','#F2F4F5'],['Schiefer','#14181B'],['Petrol','#24505F'],['Gletscher','#8FB6C6'],['Nebel','#9AA6AB']],
    light: {plane:'#F2F4F5',surface:'#F8FAFA',raised:'#FDFEFE',sunken:'#DFE4E6',ink:'#14181B',secondary:'#3E4A50',muted:'#4E5A60',accent:'#24505F','accent-ink':'#F2F4F5',glow:'#8FB6C6',line:'#C9D1D4',strong:'#9AA6AB'},
    dark:  {plane:'#0E1214',surface:'#171D20',raised:'#1F272A',sunken:'#090C0D',ink:'#EDF2F3',secondary:'#A9B6BB',muted:'#96A4AA',accent:'#6FA3B8','accent-ink':'#0E1214',glow:'#8DBED2',line:'#283236',strong:'#4E5E64'},
  },
  {
    name: 'Feldbuch',
    why: 'Die warme Richtung, aber ruhiger als die Vorlage: Haferpapier statt Creme, Waldgrün statt Olive, Ocker statt Butter. '
       + 'Damit bleibt der Charakter der Palette, die dir gefallen hat — nur trägt das Gelb nicht mehr die halbe Oberfläche, '
       + 'sondern sitzt als Lichtkante dort, wo etwas hervorgehoben gehört.',
    tones: [['Haferpapier','#EFE9DC'],['Nussbaum','#241F19'],['Waldgrün','#43503F'],['Ocker','#B98A2E'],['Leinen','#A79E8B']],
    light: {plane:'#EFE9DC',surface:'#F6F2E9',raised:'#FBF8F2',sunken:'#DCD4C3',ink:'#241F19',secondary:'#4C4A3C',muted:'#5A5748',accent:'#43503F','accent-ink':'#EFE9DC',glow:'#B98A2E',line:'#CFC7B5',strong:'#A79E8B'},
    dark:  {plane:'#17140F',surface:'#211D16',raised:'#2B261D',sunken:'#100D09',ink:'#EFE9DC',secondary:'#B5AC99',muted:'#A39B8A',accent:'#7E8C68','accent-ink':'#17140F',glow:'#D2A34A',line:'#332D22',strong:'#5C5344'},
  },
]

/** Der Orb: dieselbe Form wie in der App — sechs Achsen, offene Punkte ohne Referenz. */
function orb(p) {
  const R = 62, C = 76, vals = [0.86, 0.62, 0.74, null, 0.55, 0.7]
  const pts = vals.map((v, i) => {
    const a = (Math.PI * 2 * i) / 6 - Math.PI / 2
    const r = 22 + (v ?? 0) * (R - 22)
    return [C + Math.cos(a) * r, C + Math.sin(a) * r, v]
  })
  const d = pts.map(([x, y], i) => (i ? `L${x.toFixed(1)} ${y.toFixed(1)}` : `M${x.toFixed(1)} ${y.toFixed(1)}`)).join(' ') + ' Z'
  const dots = pts.map(([x, y, v]) =>
    `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="${v == null ? 'none' : p.accent}" stroke="${p.accent}" stroke-width="1.4"/>`).join('')
  const grid = [1, 0.66, 0.33].map(f =>
    `<circle cx="${C}" cy="${C}" r="${(22 + f * (R - 22)).toFixed(1)}" fill="none" stroke="${p.line}" stroke-width="1"/>`).join('')
  return `<svg width="152" height="152" viewBox="0 0 152 152">${grid}
    <path d="${d}" fill="${p.accent}" fill-opacity=".16" stroke="${p.accent}" stroke-width="1.8"/>
    <circle cx="${C}" cy="${C}" r="${R + 8}" fill="none" stroke="${p.glow}" stroke-width="1.2" stroke-opacity=".55"/>
    ${dots}</svg>`
}

function screen(p) {
  return `
  <div class="app">
    <div class="bar"><div class="tile">${WAVE}</div><div class="brand">Baseline<small>Leistungsdiagnose</small></div></div>
    <div class="body">
      <div class="eyebrow">Deine Leistung</div>
      <div class="name">Alex</div>
      <div class="sport">Functional Fitness</div>
      <div class="cta">Jetzt testen</div>
      <div class="due"><span>3 Tests fällig</span><span>→</span></div>
      <div class="orbwrap">${orb(p)}</div>
      <div class="cards">
        <div class="card"><b>Ausdauer</b><i>72</i><u>Perzentil</u></div>
        <div class="card"><b>Maxkraft</b><i>—</i><u>keine Referenz</u></div>
        <div class="card"><b>Schnellkraft</b><i>58</i><u>Perzentil</u></div>
      </div>
      <div class="next"><b>Nächster Test</b><p>Cooper-Test (12 Minuten) →</p></div>
      <div class="rows">
        <div class="row"><div>Cooper-Test<em>14. Juni 2026</em></div><span>3.320 m</span></div>
        <div class="row"><div>Bankdrücken 1RM<em>14. Juni 2026</em></div><span>122,5 kg</span></div>
        <div class="row"><div>Illinois Agility<em>13. Juni 2026</em></div><span>0:16.4</span></div>
      </div>
      <div class="nav"><b>Übersicht</b><span>Diagnostik</span><span>Analyse</span><span>Verlauf</span><span>Profil</span></div>
    </div>
    <div class="hero">
      <canvas></canvas>
      <div class="eyebrow">[ Baseline — Leistungsdiagnose ]</div>
      <h3><span>Finde heraus,</span><br>wo du wirklich<br>stehst.</h3>
      <div class="btn">Ohne Konto starten</div>
    </div>
  </div>`
}

const vars = p => Object.entries(p).map(([k, v]) => `--${k}:${v}`).join(';')

document.getElementById('out').innerHTML = PALETTES.map(pal => `
  <section>
    <h2>${pal.name}</h2>
    <p class="why">${pal.why}</p>
    <div class="swatches">${pal.tones.map(([n, h]) =>
      `<div class="sw"><i style="background:${h}"></i><b>${n}</b><span>${h}</span></div>`).join('')}</div>
    <div class="pair">
      <div><p class="mode">Hell</p><div class="phone" style="${vars(pal.light)}">${screen(pal.light)}</div></div>
      <div><p class="mode">Dunkel</p><div class="phone" style="${vars(pal.dark)}">${screen(pal.dark)}</div></div>
    </div>
  </section>`).join('')

/* Der Halo im Hero-Streifen, in derselben Machart wie in der App: dunkel
   additiv, hell deckend. */
document.querySelectorAll('.hero').forEach(hero => {
  const cv = hero.querySelector('canvas')
  const style = getComputedStyle(hero)
  const plane = style.getPropertyValue('--plane').trim()
  const toRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16))
  const [pr, pg, pb] = toRgb(plane)
  const dark = 0.2126 * pr + 0.7152 * pg + 0.0722 * pb < 128
  const ramp = dark
    ? [toRgb(style.getPropertyValue('--sunken').trim()), toRgb(style.getPropertyValue('--accent').trim()), toRgb(style.getPropertyValue('--ink').trim())]
    : [toRgb(style.getPropertyValue('--strong').trim()), toRgb(style.getPropertyValue('--accent').trim()), toRgb(style.getPropertyValue('--ink').trim())]
  const w = hero.clientWidth, h = hero.clientHeight, dpr = 2
  cv.width = w * dpr; cv.height = h * dpr
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  if (dark) ctx.globalCompositeOperation = 'lighter'
  const g = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v) }
  const mix = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t)
  const cy = h * 0.66, radius = Math.max(w, h * 0.9) * 0.29 * 1.6
  for (let i = 0; i < 26000; i++) {
    const th = Math.random() * Math.PI * 2
    const r = 0.95 + Math.abs(g()) * 0.9 * 0.55 + Math.random() * 0.15
    const x = Math.cos(th) * r, y = Math.sin(th) * r
    const px = w / 2 + x * radius, py = cy + y * radius
    if (px < 0 || px > w || py < 0 || py > h) continue
    const vert = Math.min(1, Math.max(0, -y * 0.5 + 0.5))
    const s = Math.min(1, Math.max(0, (vert - 0.55) / 0.45))
    let col = mix(ramp[0], ramp[1], Math.min(1, vert / 0.7))
    col = mix(col, ramp[2], s * s * (3 - 2 * s) * 0.9)
    ctx.globalAlpha = Math.min(1, (0.3 + 0.7 * vert) * (0.55 + Math.random() * 0.5) * (dark ? 0.55 : 0.3))
    ctx.fillStyle = `rgb(${col.map(c => c | 0).join(' ')})`
    ctx.fillRect(px, py, 1, 1)
  }
})
</script>
</body>
</html>
