# Deployment-Konfiguration für Netlify.
#
# Anbinden: In Netlify das Projekt "baseline-diagnostics" öffnen →
# "Import from Git" → dieses Repository, Branch
# claude/sports-diagnostics-pwa-jnqy42. Build-Befehl und Publish-Verzeichnis
# kommen aus dieser Datei, es ist nichts weiter einzutragen.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Der Publishable Key ist bewusst öffentlich — abgesichert wird über RLS in
  # der Datenbank, nicht über Geheimhaltung des Clients.
  VITE_SUPABASE_URL = "https://bsbionvnsvqghaqijmpl.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5HjIDmeWLD0lr1Gy9r4E8A_q-YHpSvE"
  # Testphase (Entscheidung des Inhabers, 5. Oktober 2026): Trainingsbereich in der
  # Vorschau (Regeln und Vorlagen sind ungeprüft und als solche gekennzeichnet) und
  # Pläne vom Trainer. Zurücknehmen: beide Zeilen entfernen oder auf "off" setzen.
  # Die Zuweisung braucht die Migration 20261005100000_plan_assignments.sql in Supabase.
  VITE_TRAINING_PLAN = "preview"
  VITE_PLAN_ASSIGN = "on"
  # Sprachmodell-Umformulierung (Entscheidung des Inhabers, 5. Oktober 2026): in der
  # Auslieferung eingeschaltet. Die Edge Function `phrase` und ihr Schlüssel müssen im
  # Supabase-Projekt eingerichtet sein; ohne sie fällt jede Antwort auf die Vorlage
  # zurück (kein Fehler). AVV, Region und Datenschutztext liegen beim Inhaber.
  # Zurücknehmen: Zeile entfernen oder auf "off" setzen.
  VITE_AI_PHRASE = "on"

# Single-Page-App: jede Route muss auf index.html zeigen, sonst liefert ein
# Direktaufruf oder ein Reload eine 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sicherheits- und Cache-Regeln stehen in public/_headers, damit sie auch beim
# manuellen Deploy per Drag-and-drop gelten — die netlify.toml wird dort nicht
# ausgewertet. Doppelte Pflege wäre eine Fehlerquelle.
